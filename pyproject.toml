[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frappe_er_generator"
dynamic = ["version"]
description = "Entity relationship and dependency explorer for Frappe DocTypes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sumit Jain", email = "jainmit23@gmail.com" }
]
dependencies = [
    "graphviz"
]

[project.urls]
Repository = "https://github.com/Aakvatech-Limited/frappe_er_generator"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["frappe_er_generator*"]

[tool.setuptools.dynamic]
version = { attr = "frappe_er_generator.__version__" }

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
